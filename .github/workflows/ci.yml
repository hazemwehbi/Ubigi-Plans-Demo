name: Contrôles de l’extension
on: [push, pull_request]
jobs:
 integration:
  runs-on: ubuntu-latest
  strategy:
   matrix:
    php: ['8.1', '8.3']
    wordpress: ['6.5', 'latest']
  services:
   mysql:
    image: mysql:8.0
    env:
     MYSQL_ROOT_PASSWORD: test
     MYSQL_DATABASE: wordpress
    ports: ['3306:3306']
    options: --health-cmd="mysqladmin ping -ptest" --health-interval=10s --health-timeout=5s --health-retries=10
  steps:
   - uses: actions/checkout@v4
   - uses: shivammathur/setup-php@v2
     with:
      php-version: '${{ matrix.php }}'
      extensions: mysqli, mbstring, curl
      tools: composer
   - uses: actions/setup-node@v4
     with:
      node-version: '22'
   - name: Syntaxe
     run: |
      find ubigi-plans-demo tests -name '*.php' -print0 | xargs -0 -n1 php -l
      node --check ubigi-plans-demo/public/assets/catalogue.js
      node --check ubigi-plans-demo/admin/assets/ai.js
   - name: Normes de code WordPress
     run: |
      composer install --no-interaction --prefer-dist
      composer lint
   - name: Installation WordPress jetable
     run: |
      curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
      mkdir /tmp/wordpress
      php /tmp/wp core download --path=/tmp/wordpress --version=${{ matrix.wordpress }}
      php /tmp/wp config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=test --dbhost=127.0.0.1:3306
      php /tmp/wp core install --path=/tmp/wordpress --url=http://localhost --title=QA --admin_user=qa --admin_password="$(openssl rand -hex 24)" --admin_email=qa@example.invalid --skip-email
      cp -R ubigi-plans-demo /tmp/wordpress/wp-content/plugins/
   - name: Intégration
     env:
      UPD_WP_ROOT: /tmp/wordpress
     run: |
      php tests/integration.php
      php tests/uninstall.php
